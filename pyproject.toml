[project]
name = "dj-music-plugin"
version = "1.12.0"
description = "MCP server for DJ techno music library management"
requires-python = ">=3.12"
dependencies = [
    "fastmcp[tasks,apps]>=3.2.4,<3.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "mdxnet-infer>=0.1.0",
    "pyrekordbox>=0.4.4",
]

[project.optional-dependencies]
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "scipy>=1.12",
    "essentia==2.1b6.dev1389",
    "numba>=0.65",
    "llvmlite>=0.47",
]
stems = [
    "demucs>=4.0",
    "torch>=2.0",
    "torchcodec>=0.14",
    "psutil>=5.9",
    "soundfile>=0.12",
    "scipy>=1.12",
    # Native Apple Silicon Demucs backend. demucs-mlx 1.4.6 documents
    # MLX 0.31.2 + mlx-audio-io 1.3.11 and does not yet support MLX 0.32.
    "demucs-mlx>=1.4.6,<1.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx>=0.31.2,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "onnxruntime-silicon>=1.16.3; sys_platform == 'darwin' and python_version < '3.12'",
    "onnxruntime>=1.18; sys_platform != 'darwin' or python_version >= '3.12'",
]
postgres = ["pgvector>=0.3"]
supabase = [
    "supabase>=2.0",
    "pgvector>=0.3",
]
otel = [
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
]
sentry = ["sentry-sdk>=2.0"]
observability = [
    "sentry-sdk>=2.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "UP046",
    "E402",
]
unfixable = ["F401", "F811", "F841"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/**" = ["E501"]
"app/audio/**" = ["RUF012", "E501"]
"app/tools/**" = ["B008", "E501"]
"app/handlers/**" = ["B008", "E501"]
"app/resources/**" = ["B008", "E501", "RUF001"]
"app/providers/**" = ["E501"]
"tests/**" = ["E501", "RUF012", "B017", "N806"]
"scripts/bench_stems_m2.py" = ["E501", "RUF001", "RUF002", "RUF003", "SIM105", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
exclude = ["scripts"]
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true

[[tool.mypy.overrides]]
module = ["librosa.*", "soundfile.*", "essentia.*", "key_value.*", "sentry_sdk.*", "opentelemetry.*", "anthropic.*", "scipy.*", "pyloudnorm.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n auto --dist loadfile"
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore:n_fft=.*is too large for input signal of length.*:UserWarning:librosa.*",
    "ignore:Trying to estimate tuning from empty frequency set.*:UserWarning:librosa.*",
    "ignore:'aifc' is deprecated.*:DeprecationWarning:audioread.*",
    "ignore:'audioop' is deprecated.*:DeprecationWarning:audioread.*",
    "ignore:'sunau' is deprecated.*:DeprecationWarning:audioread.*",
    "ignore:'aifc' is deprecated.*:DeprecationWarning",
    "ignore:'audioop' is deprecated.*:DeprecationWarning",
    "ignore:'sunau' is deprecated.*:DeprecationWarning",
    "ignore:PySoundFile failed.*:UserWarning",
    "ignore:.*__audioread_load.*:FutureWarning",
    "ignore:unclosed file.*:ResourceWarning",
    "ignore::ResourceWarning",
    "ignore:coroutine.*was never awaited:RuntimeWarning",
    "ignore:.*Connection\\._cancel.*:RuntimeWarning",
]
markers = [
    "integration: live external-service round-trips, skipped without secrets (e.g. DJ_YM_TOKEN)",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "alembic>=1.14",
    "import-linter>=2.11",
    "respx>=0.23.1",
]
